[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
markers =
    p1: Critical Smoke & Core Regression (run every build)
    p2: Standard Regression
    p3: Edge / Low-priority / Bulk tests
    api: REST API level tests
    security: Security tests (JWT, XSS, NoSQLi, Brute-force)
    authorize: RBAC & IDOR authorization tests
    db: Direct Database verification (MongoDB, Redis, Cassandra, Neo4j)
    concurrency: Parallel race-condition tests
    uc01: UC01 Account & Profile
    uc02: UC02 Appointment Booking & Slot Lock
    uc03: UC03 Patient Appointment Management
    uc04: UC04 Queue Tracking
    uc05: UC05 Medical Record Lookup
    uc06: UC06 Medical History & Vitals
    uc07: UC07 Patient Billing
    uc08: UC08 Notifications
    uc09: UC09 Reception Check-in
    uc10: UC10 Reception Appointment Management
    uc11: UC11 Queue Management & LCD
    uc12: UC12 Patient Profile Management
    uc13: UC13 Billing, VietQR & Excel Export
    uc14: UC14 Doctor Consultation Queue
    uc15: UC15 EMR & Lock
    uc16: UC16 Clinical Service Orders
    uc17: UC17 Clinical Service Results
    uc18: UC18 Prescription & Neo4j Safety
    uc19: UC19 Admin Users, RBAC & Audit Logs
    uc20: UC20 Pharmacy Drug Catalog
    uc21: UC21 Pharmacy Inventory & Low Stock
    uc22: UC22 Medical Services Catalog
    uc23: UC23 Doctor Schedules
    uc24: UC24 Dashboard & Executive Reports
