# Smart Clinic EMR – cụm 4 CSDL NoSQL cho môi trường phát triển
# Khởi chạy:  docker compose up -d
# Dừng:       docker compose down        (thêm -v để xóa sạch dữ liệu)
#
# Các container *-init chạy một lần để nạp schema + dữ liệu mẫu rồi tự thoát.
# Mọi cổng chỉ mở trên 127.0.0.1 (máy local).
#
# RAM: cấu hình cho máy cấp ~3 GB cho Docker/WSL (tổng giới hạn ≈ 2,4 GB).
# Neo4j chờ Cassandra khởi động xong để hai JVM không cùng chiếm RAM lúc khởi động.

name: smart-clinic

services:
  mongodb:
    image: mongo:7.0
    container_name: clinic-mongodb
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 512m
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: clinic_db
    volumes:
      - mongo-data:/data/db
      - ./database/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/01-init-mongo.js:ro
      - ./database/mongodb/seed-data.sh:/docker-entrypoint-initdb.d/02-seed-data.sh:ro
      - ./database/mongodb/seed:/seed:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: clinic-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    mem_limit: 128m
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-init:
    image: redis:7.4-alpine
    container_name: clinic-redis-init
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./database/redis/init-redis.redis:/init/init-redis.redis:ro
    entrypoint: ["sh", "-c", "redis-cli -h redis < /init/init-redis.redis && echo 'Redis seed OK'"]
    restart: "no"

  cassandra:
    image: cassandra:4.1
    container_name: clinic-cassandra
    mem_limit: 1g
    restart: unless-stopped
    ports:
      - "127.0.0.1:9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: clinic-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 384M
      HEAP_NEWSIZE: 96M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  cassandra-init:
    image: cassandra:4.1
    container_name: clinic-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./database/cassandra/init-schema.cql:/init/init-schema.cql:ro
      - ./database/cassandra/seed-data.cql:/init/seed-data.cql:ro
    entrypoint: ["sh", "-c", "cqlsh cassandra -f /init/init-schema.cql && cqlsh cassandra -f /init/seed-data.cql && echo 'Cassandra seed OK'"]
    restart: "no"

  neo4j:
    image: neo4j:5.26-community
    container_name: clinic-neo4j
    mem_limit: 768m
    restart: unless-stopped
    depends_on:
      cassandra:
        condition: service_healthy
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/clinic12345
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 64m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p clinic12345 'RETURN 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  neo4j-init:
    image: neo4j:5.26-community
    container_name: clinic-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./database/neo4j/init-graph.cypher:/init/init-graph.cypher:ro
    entrypoint: ["sh", "-c", "cypher-shell -a bolt://neo4j:7687 -u neo4j -p clinic12345 -f /init/init-graph.cypher && echo 'Neo4j seed OK'"]
    restart: "no"

volumes:
  mongo-data:
  redis-data:
  cassandra-data:
  neo4j-data:
