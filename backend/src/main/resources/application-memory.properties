# Profile "memory": lưu dữ liệu trong RAM, không kết nối CSDL nào.
# Chỉ dùng cho unit test hoặc demo nhanh khi máy không có Docker.
clinic.storage=memory

spring.autoconfigure.exclude=\
  org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,\
  org.springframework.boot.mongodb.autoconfigure.MongoReactiveAutoConfiguration,\
  org.springframework.boot.mongodb.autoconfigure.health.MongoHealthContributorAutoConfiguration,\
  org.springframework.boot.mongodb.autoconfigure.health.MongoReactiveHealthContributorAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoReactiveAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoReactiveRepositoriesAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration,\
  org.springframework.boot.cassandra.autoconfigure.CassandraAutoConfiguration,\
  org.springframework.boot.cassandra.autoconfigure.health.CassandraHealthContributorAutoConfiguration,\
  org.springframework.boot.cassandra.autoconfigure.health.CassandraReactiveHealthContributorAutoConfiguration,\
  org.springframework.boot.data.cassandra.autoconfigure.DataCassandraAutoConfiguration,\
  org.springframework.boot.data.cassandra.autoconfigure.DataCassandraReactiveAutoConfiguration,\
  org.springframework.boot.data.cassandra.autoconfigure.DataCassandraRepositoriesAutoConfiguration,\
  org.springframework.boot.data.cassandra.autoconfigure.DataCassandraReactiveRepositoriesAutoConfiguration,\
  org.springframework.boot.neo4j.autoconfigure.Neo4jAutoConfiguration,\
  org.springframework.boot.neo4j.autoconfigure.health.Neo4jHealthContributorAutoConfiguration,\
  org.springframework.boot.data.neo4j.autoconfigure.DataNeo4jAutoConfiguration,\
  org.springframework.boot.data.neo4j.autoconfigure.DataNeo4jReactiveAutoConfiguration,\
  org.springframework.boot.data.neo4j.autoconfigure.DataNeo4jRepositoriesAutoConfiguration,\
  org.springframework.boot.data.neo4j.autoconfigure.DataNeo4jReactiveRepositoriesAutoConfiguration
