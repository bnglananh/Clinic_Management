spring.application.name=clinic-backend
server.port=8080

# =========================================================================
# Tầng lưu trữ: nosql (mặc định – MongoDB, Redis, Cassandra, Neo4j) | memory
# Chạy không cần Docker:  mvnw spring-boot:run -Dspring-boot.run.profiles=memory
# =========================================================================
clinic.storage=nosql

# ---------- MongoDB (Document Store) – dữ liệu nghiệp vụ chính ----------
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/clinic_db}
spring.data.mongodb.representation.big-decimal=decimal128

# ---------- Redis (Key-Value) – OTP, khóa slot, bộ đếm STT, cache ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ---------- Apache Cassandra (Column-family) – sinh hiệu & nhật ký kiểm toán ----------
spring.cassandra.contact-points=${CASSANDRA_HOST:localhost}:${CASSANDRA_PORT:9042}
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=clinic_keyspace
spring.cassandra.schema-action=none

# ---------- Neo4j (Graph) – tri thức thuốc & cảnh báo tương tác (DDI) ----------
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:clinic12345}

# ---------- Xác thực JWT ----------
# Đổi khóa bí mật khi triển khai thật (tối thiểu 32 ký tự), ví dụ qua biến môi trường JWT_SECRET
clinic.auth.jwt-secret=${JWT_SECRET:smart-clinic-dev-secret-change-me-0123456789}
clinic.auth.token-ttl=PT8H
# true = trả mã OTP trong response (chỉ để demo khi chưa cấu hình SMTP)
clinic.auth.expose-dev-otp=false

# Jackson 3 (Spring Boot 4) mặc định từ chối null cho kiểu nguyên thủy; giữ hành vi như Jackson 2
# để các trường boolean/int bị bỏ trống trong request nhận giá trị mặc định (false/0).
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Logging
logging.level.vn.clinic=DEBUG
logging.level.org.springframework.web=INFO

